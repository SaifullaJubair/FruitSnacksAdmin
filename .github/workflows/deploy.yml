name: Deploy Admin Panel

on:
  push:
    branches: [main] # যদি আপনার মেইন ব্রাঞ্চের নাম master হয়, তবে এখানে master লিখবেন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/artisenleather/admin
            git reset --hard
            git pull origin main
            npm install
            # বিল্ড করার আগে পুরনো dist ফোল্ডার মুছে ফেলা ভালো
            rm -rf dist
            npm run build
            # Nginx ক্যাশ ক্লিয়ার করতে রিস্টার্ট (ঐচ্ছিক কিন্তু নিরাপদ)
            sudo systemctl restart nginx
