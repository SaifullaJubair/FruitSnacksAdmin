name: Deploy Admin Panel

on:
  push:
    branches: [main] # যদি আপনার মেইন ব্রাঞ্চের নাম master হয়, তবে এখানে master লিখবেন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/artisenleather/admin
            git reset --hard
            git pull origin main
            npm install
            rm -rf dist
            # ১জিবি র‍্যামের জন্য মেমোরি লিমিট সহ বিল্ড
            NODE_OPTIONS="--max-old-space-size=512" npm run build

            # --- পারমিশন ফিক্স (নিচের লাইনগুলো যোগ করুন) ---
            sudo chown -R www-data:www-data /var/www/artisenleather/admin/dist
            sudo chmod -R 755 /var/www/artisenleather/admin/dist

            sudo systemctl restart nginx
            echo "Deployment and Permissions fixed!"
